services:
  postgres:
    image: postgres:16
    container_name: azupdados-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # exposto só em localhost: acesso externo via túnel SSH, nunca porta aberta
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    # Teto de memória: o azupdados divide o servidor com serviços de produção e nunca pode
    # disputar RAM com eles. Parâmetros do Postgres dimensionados para caber nesse limite.
    mem_limit: 1536m
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
