  - name: fato_inse_escola_edicao
    description: >
      Indicador de Nível Socioeconômico (INSE) por escola, calculado pelo INEP com o questionário do SAEB.
      Grão — escola × edição. Edições 2013 (2011–2013) e 2015 têm outra metodologia
      (`eh_metodologia_saeb` = false) e não se comparam com 2019, 2021 e 2023.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [co_entidade, ano_saeb]}
    columns:
      - name: fato_inse_escola_edicao_sk
        tests: [unique, not_null]
      - name: escola_sk
        tests:
          - relationships:
              arguments: {to: ref('dim_escola'), field: escola_sk}
      - name: inse_nivel
        description: "Nível: 2019+ I–VIII → 1–8; 2015 Grupo 1–6; 2013 Muito Baixo…Muito Alto → 1–7. Não comparar entre metodologias."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 8}
      - name: inse_valor
        description: "Média do INSE na escola (escala muda com a metodologia)."
