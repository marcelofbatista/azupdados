version: 2

models:
  - name: fato_rendimento_escola_ano
    description: >
      Taxas de rendimento — indicador oficial do INEP por escola. Grão — escola × ano × etapa/série. Fonte: arquivos
      "REND_<ano>_ESCOLAS" de gov.br/inep (indicadores educacionais), 2015–2025.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [co_entidade, ano_censo, etapa_indicador_sk]}
    columns:
      - name: fato_rendimento_escola_ano_sk
        tests: [unique, not_null]
      - name: escola_sk
        description: "Nulo quando a escola não está no Censo carregado (o código INEP fica em co_entidade)."
        tests:
          - relationships:
              arguments: {to: ref('dim_escola'), field: escola_sk}
      - name: co_entidade
        tests: [not_null]
      - name: etapa_indicador_sk
        description: "Etapa ou série (dim_etapa_indicador). Totais e subtotais (`eh_agregado`) não se somam às séries."
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_etapa_indicador'), field: etapa_indicador_sk}
      - name: taxa_aprovacao
        description: "Taxa de aprovação (%) — INEP, rótulo \"Taxa de Aprovação\"."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}

      - name: taxa_reprovacao
        description: "Taxa de reprovação (%)."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}

      - name: taxa_abandono
        description: "Taxa de abandono (%)."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
              config: {severity: error}

