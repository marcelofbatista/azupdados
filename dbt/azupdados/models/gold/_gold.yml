version: 2

models:
  - name: dim_tempo
    description: >
      Dimensão de tempo no grão ano, com recortes de leitura: fase da pandemia (2020–2021 com escolas
      fechadas ou remotas), ciclo dos mandatos federal/estadual e municipal (só o período) e anos de SAEB.
    columns:
      - name: ano_censo
        tests: [unique, not_null]
      - name: fase_pandemia
        tests:
          - accepted_values:
              arguments: {values: ['pré-pandemia', 'pandemia', 'pós-pandemia']}
      - name: mandato_federal_estadual
        description: "Ciclo de governo federal e estadual que contém o ano (ex.: 2019–2022)."
      - name: mandato_municipal
        description: "Ciclo de governo municipal que contém o ano (ex.: 2021–2024)."

  - name: dim_escola
    description: >
      Dimensão escola (SCD tipo 1). Atributos descritivos do ano mais recente em que a escola
      aparece no Censo; `primeiro_ano` e `ultimo_ano` delimitam sua presença na série.
    columns:
      - name: escola_sk
        description: Chave substituta (hash do código INEP).
        tests: [unique, not_null]
      - name: co_entidade
        description: Código INEP da escola.
        tests: [unique, not_null]

  - name: fato_matricula_escola_ano
    description: Matrículas da educação básica. Grão — escola × ano.
    columns:
      - name: fato_matricula_escola_ano_sk
        tests: [unique, not_null]
      - name: escola_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_escola')
                field: escola_sk
      - name: ano_censo
        tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: ano_censo
      - name: tp_dependencia
        tests:
          - relationships:
              arguments:
                to: ref('dim_dependencia_adm')
                field: tp_dependencia
      - name: co_uf
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: co_uf
      - name: co_municipio
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: co_municipio
      - name: qt_mat_bas
        tests: [sem_sentinela_inep]
      - name: qt_mat_integral_inf_fund_med
        description: >
          Matrículas em tempo integral, derivadas como infantil + fundamental + médio.
          O INEP não publica um total de integral para a educação básica; EJA e profissional ficam de fora.
        tests: [sem_sentinela_inep]

  - name: fato_ee_tipo_uf_ano
    description: >
      Matrículas da educação especial por tipo (deficiência, TEA, AH/SD). Grão — ano × UF × dependência × tipo.
      `qt_sedap` é o número protegido com ruído; `qt_estimada` é a proporção do tipo no SEDAP+ aplicada ao
      total aberto da educação especial (`qt_mat_esp_aberto`). Use `qt_estimada` para análise; ambos servem
      para tendência, não para célula pequena. Ver docs/armadilhas/09.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ano_censo, co_uf, tp_dependencia, tipo_deficiencia_sk]
    columns:
      - name: fato_ee_tipo_uf_ano_sk
        tests: [unique, not_null]
      - name: tipo_deficiencia_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_deficiencia_inep')
                field: tipo_deficiencia_sk
      - name: tp_dependencia
        tests:
          - relationships:
              arguments:
                to: ref('dim_dependencia_adm')
                field: tp_dependencia
      - name: qt_sedap
        description: Valor protegido, com ruído. Pode ser negativo em célula pequena — não cortar antes de somar.
      - name: qt_estimada
        description: Nulo quando a célula não é confiável (educação especial do grupo abaixo do mínimo).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: proporcao_no_grupo
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "eh_celula_confiavel and qt_sedap >= 0"

  - name: dim_municipio
    description: Municípios pelo código IBGE de 7 dígitos (o mesmo usado pelo INEP), com UF e região.
    columns:
      - name: co_municipio
        tests: [unique, not_null]
      - name: co_uf
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: co_uf

  - name: fato_matricula_cor_raca_escola_ano
    description: >
      Matrículas da educação básica por cor/raça. Grão — escola × ano × cor/raça. O INEP publica cada recorte
      separadamente (marginais): não há cruzamento cor/raça × outro recorte no microdado aberto.
    columns:
      - name: fato_matricula_cor_raca_escola_ano_sk
        tests: [unique, not_null]
      - name: cor_raca_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cor_raca')
                field: cor_raca_sk
      - name: qt_matriculas
        tests: [sem_sentinela_inep]

  - name: fato_matricula_sexo_escola_ano
    description: >
      Matrículas da educação básica por sexo. Grão — escola × ano × sexo. O INEP publica cada recorte
      separadamente (marginais): não há cruzamento sexo × outro recorte no microdado aberto.
    columns:
      - name: fato_matricula_sexo_escola_ano_sk
        tests: [unique, not_null]
      - name: sexo_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sexo')
                field: sexo_sk
      - name: qt_matriculas
        tests: [sem_sentinela_inep]

  - name: fato_matricula_faixa_etaria_escola_ano
    description: >
      Matrículas da educação básica por faixa etária. Grão — escola × ano × faixa etária. O INEP publica cada recorte
      separadamente (marginais): não há cruzamento faixa etária × outro recorte no microdado aberto.
    columns:
      - name: fato_matricula_faixa_etaria_escola_ano_sk
        tests: [unique, not_null]
      - name: faixa_etaria_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_faixa_etaria')
                field: faixa_etaria_sk
      - name: qt_matriculas
        tests: [sem_sentinela_inep]

  - name: fato_infraestrutura_escola_ano
    description: >
      Infraestrutura da escola (água, energia, esgoto, salas, biblioteca, laboratórios, quadra, internet, acessibilidade, sala de AEE). Grão — escola × ano. Nulo = não informado ou indicador inexistente naquele ano.
    columns:
      - name: fato_infraestrutura_escola_ano_sk
        tests: [unique, not_null]
      - name: escola_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_escola')
                field: escola_sk
      - name: co_uf
        tests:
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: co_uf
      - name: qt_salas_utilizadas
        description: Contagem física de salas em uso, não por turno.
        tests: [sem_sentinela_inep]

  - name: fato_docentes_turmas_escola_ano
    description: >
      Docentes e turmas por etapa. Grão — escola × ano. O docente é contado em cada etapa em que atua.
    columns:
      - name: fato_docentes_turmas_escola_ano_sk
        tests: [unique, not_null]
      - name: escola_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_escola')
                field: escola_sk
      - name: co_uf
        tests:
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: co_uf
      - name: qt_doc_bas
        tests: [sem_sentinela_inep]
      - name: qt_tur_bas
        tests: [sem_sentinela_inep]

  - name: fato_profissionais_escola_ano
    description: >
      Profissionais escolares não docentes. Grão — escola × ano.
    columns:
      - name: fato_profissionais_escola_ano_sk
        tests: [unique, not_null]
      - name: escola_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_escola')
                field: escola_sk
      - name: co_uf
        tests:
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: co_uf
      - name: qt_prof_psicologo
        tests: [sem_sentinela_inep]

  - name: fato_ideb_escola_ano
    description: >
      IDEB por escola. Grão — escola × etapa × edição (anos iniciais e finais desde 2005, ensino médio desde
      2017). Medidas: taxa de aprovação da etapa, indicador de rendimento (P), notas padronizadas do SAEB,
      nota média padronizada (N), IDEB observado e meta (as metas só vão até 2021).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_escola, etapa_sk, ano_ideb]
    columns:
      - name: fato_ideb_escola_ano_sk
        tests: [unique, not_null]
      - name: escola_sk
        description: Nulo para escolas que só aparecem em edições anteriores ao primeiro Censo carregado.
        tests:
          - relationships:
              arguments:
                to: ref('dim_escola')
                field: escola_sk
      - name: etapa_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_etapa')
                field: etapa_sk
      - name: co_uf
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: co_uf
      - name: ideb
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10

  - name: fato_ideb_municipio_ano
    description: IDEB por município e rede. Grão — município × rede × etapa × edição.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [co_municipio, rede, etapa_sk, ano_ideb]
    columns:
      - name: fato_ideb_municipio_ano_sk
        tests: [unique, not_null]
      - name: co_municipio
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: co_municipio
      - name: rede
        tests:
          - relationships:
              arguments:
                to: ref('dim_rede_ideb')
                field: rede
      - name: ideb
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10

  - name: fato_ideb_agregado_ano
    description: >
      IDEB do Brasil, das grandes regiões e das UFs. Grão — território × rede × etapa × edição.
      `nivel` diz se a linha é Brasil, região ou UF; nome sem correspondência nas dimensões fica com nível nulo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [no_territorio, rede, etapa_sk, ano_ideb]
    columns:
      - name: fato_ideb_agregado_ano_sk
        tests: [unique, not_null]
      - name: nivel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['brasil', 'regiao', 'uf']
      - name: rede
        tests:
          - relationships:
              arguments:
                to: ref('dim_rede_ideb')
                field: rede
