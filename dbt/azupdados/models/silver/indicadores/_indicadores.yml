version: 2

models:
  - name: stg_ind__mapa_colunas
    description: >
      De-para de TODAS as colunas dos indicadores INEP por escola: arquivo, posição, nome técnico, rótulo,
      e o que a silver fez com cada uma. Etapa e medida vêm do rótulo; `etapa_pelo_nome` é o que o nome
      técnico diria. Onde divergem, o arquivo do INEP tem o nome errado (armadilha 12).
    columns:
      - name: medida
        description: "Coluna de medida da silver (slot). Nula só para colunas de identificação."
        tests:
          - not_null:
              config: {where: "not eh_identificacao"}
      - name: etapa
        tests:
          - not_null:
              config: {where: "not eh_identificacao"}
          - relationships:
              arguments: {to: ref('dim_etapa_indicador'), field: codigo}
      - name: etapa_pelo_nome
        description: "Etapa que o nome técnico indicaria. Só para auditoria; nunca usada nos dados."

  - name: stg_ind__rend
    description: >
      Taxas de rendimento (INEP) por escola — escola × ano × etapa, uma coluna por medida. Lido de
      bronze.ind_rend_<ano> pelo rótulo das colunas (macro ind_por_escola). '--' vira nulo; linha sem
      nenhuma medida sai.
    columns:
      - name: co_entidade
        tests: [not_null]
      - name: qt_valores_invalidos
        description: "Textos que não são ausência ('--') nem número. Devem ser zero."
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 0}
      - name: taxa_aprovacao
        description: "Taxa de aprovação (%) — INEP, rótulo \"Taxa de Aprovação\"."
      - name: taxa_reprovacao
        description: "Taxa de reprovação (%)."
      - name: taxa_abandono
        description: "Taxa de abandono (%)."

